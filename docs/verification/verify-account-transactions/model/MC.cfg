\* Base bounds. run.py writes per-run copies that change only Variant and the invariant list.
CONSTANTS
    MaxKills = 2
    MaxIOErrors = 2
    MaxUserChanges = 1
    Variant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ChangesAreJournaled
    NoSpuriousRefusal
    NoClobber
    RefusalChangesNothing
